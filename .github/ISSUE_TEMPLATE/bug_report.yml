name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Browser Agent Guide
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem! Please fill out the form below to help us diagnose and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Versions of relevant software (Chrome version, OS, Node.js version if running daemon).
      placeholder: Chrome 130 (macOS 15), Node.js v20.12.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      description: Which AI provider were you using when the issue occurred?
      options:
        - OpenAI
        - Anthropic
        - Google Gemini
        - Custom (OpenAI Compatible)
        - None / Daemon only
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Open target page at '...'
        2. Open side panel and type '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: Attach relevant console errors, daemon logs, or screenshots if applicable.
      placeholder: Console errors or terminal logs...
