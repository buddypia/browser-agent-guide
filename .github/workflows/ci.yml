# 全ゲートの正。ローカル(make ship)は node だけの速い検査(check:fast)しか回さず、ブラウザ E2E と daemon テストは
# ここで回して、make ship はこの結果を待ってからマージする。
#
# 背景(2026-10-21 実測): 並行する AI セッションが各 worktree でフル check を回すとマシンが飽和し
# (load average 100〜300 / 16 コア)、クリーンな main でも拡張ロード系 E2E が 3 件タイムアウトで落ち、
# 1 回のゲートに 7 分以上かかっていた。クリーンなランナーなら負荷は他セッションと無関係になる。
# 旧 glossary.yml の 3 ステップは check:fast に含まれる(--no-verify でローカル hook を外してもここで捕まる)。
#
# PR 時は変更パスに応じて重いジョブ(test:guard, daemon, e2e)をスコープ実行し、main への push 時は常に全スイートを回す。
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # glossary:staleness と check:harness の台帳ゲートが origin/main との merge-base を見る
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # node --test のグロブ展開(test:glossary)は Node 21+ が必要
      # --ignore-scripts: postinstall(setup-skills)は CLI ごとの skill 配置で、CI には不要
      - run: npm ci --ignore-scripts
      - run: npm ci # test:agent-verbs が daemon/src/server.js を import する
        working-directory: daemon
      - run: npm run check:fast
      - id: guard_scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only origin/main...HEAD | grep -qE '^(scripts/agent-worktree-guard/|\.claude/hooks/|\.codex/hooks\.json$|\.agents/hooks\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "guard-untouched PR: test:guard deferred to main push"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard_scope.outputs.run == 'true'
        run: npm run test:guard # ローカルの check:fast には入れず、PR(ガード変更時)と main push で実行

  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(daemon/|lib/slug\.js$|content/content-script\.js$|test/agent-verbs\.test\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "daemon-untouched PR: daemon tests deferred to main push"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
        working-directory: daemon
      - if: steps.scope.outputs.run == 'true'
        run: npm test
        working-directory: daemon

  e2e:
    # 視覚ゲート(ui-quality の「道具は1列」など)は macOS のフォントで調整されている。ubuntu では system-ui が
    # 字幅の広い DejaVu Sans になり、360px で道具が折り返して決定的に落ちた(#157 の初回 CI)。開発機と同じ OS で回す。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # PR のマージコミットと base(HEAD^1)の差分で対象を決める
      # 文書・用語集・ハーネス/ガード専用 PR はブラウザを起動しない(拡張本体・UI spec に無関係)。main への push は常に全部。
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qvE '(\.md$|^docs/|^glossary/|^\.claude/|^\.codex/|^\.agents/|^scripts/(agent-worktree-guard/|glossary/|check-|harness-library\.mjs$|auto-ship\.mjs$|run-checks\.mjs$|agent-scratchpad\.mjs$)|^test/(glossary/|check-harness|harness-library|auto-ship|cleanup-merged-branches|antigravity-hooks)|^Makefile$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "non-extension/docs/harness change: e2e skipped on PR (runs on main)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts && npm ci --prefix daemon # UI spec は daemon のモジュールを import する
      - if: steps.scope.outputs.run == 'true'
        run: npx playwright install chromium && npm install -g @playwright/cli@0.1.21 # npm test は playwright-cli 経由
      - if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
